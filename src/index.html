        <h1>Création de sites internet pour indépendants et PME</h1>
        <p>
          Adrien Leteinturier est développeur web freelance en France. Il crée
          des sites vitrines WordPress, des sites web sur mesure et des outils
          internes pour les indépendants et les petites entreprises.
        </p>
        <h2>Un site clair et utile pour votre activité</h2>
        <p>
          Votre site doit présenter vos services, rassurer vos visiteurs et
          faciliter les prises de contact. Chaque projet est pensé pour être
          lisible sur mobile, simple à faire évoluer et cohérent avec votre
          identité. L’accompagnement couvre le cadrage, le design, le
          développement, la mise en ligne et la prise en main.
        </p>
        <p>
          Un site professionnel ne se limite pas à une belle page d’accueil.
          L’arborescence, les textes, les appels à l’action et les performances
          techniques doivent aider vos visiteurs à comprendre rapidement votre
          offre. Le contenu est structuré pour répondre aux questions de vos
          futurs clients et pour donner aux moteurs de recherche des signaux
          clairs sur votre activité.
        </p>
        <h2>Services de développement web</h2>
        <ul>
          <li>Création de site vitrine WordPress professionnel.</li>
          <li>Développement web sur mesure avec Angular et Node.js.</li>
          <li>Refonte de site internet et amélioration du référencement naturel.</li>
          <li>Formulaires, espaces clients et outils métier internes.</li>
        </ul>
        <h2>Une méthode simple et transparente</h2>
        <p>
          Nous commençons par clarifier votre activité, vos clients et vos
          priorités. Nous construisons ensuite une expérience adaptée à votre
          quotidien, avec des échanges réguliers et des choix techniques
          proportionnés au projet. Avant la mise en ligne, le site est vérifié
          sur ordinateur et mobile. Vous repartez avec une présence en ligne
          claire, rapide et prête à évoluer.
        </p>
        <p>
