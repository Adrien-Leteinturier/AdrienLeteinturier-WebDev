<a class="skip-link" href="#main-content">Aller au contenu</a>
<header (keydown.escape)="closeMenu()">
  <nav class="container" aria-label="Navigation principale">
    <a class="brand" href="#myself" (click)="closeMenu()"
      ><span class="brand-symbol" aria-hidden="true">a<span>.</span></span
      ><span>Adrien<br /><strong>Leteinturier</strong></span></a
    >
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpened()"
      aria-controls="main-navigation"
    >
      {{ isMenuOpened() ? "Fermer ×" : "Menu +" }}
    </button>
    <div id="main-navigation" [class.open]="isMenuOpened()">
      <a href="#offer" (click)="closeMenu()">Pack vitrine</a
      ><a href="#services" (click)="closeMenu()">Services</a
      ><a href="#work" (click)="closeMenu()">Réalisations</a
      ><a href="#about" (click)="closeMenu()">À propos</a
      ><a class="nav-contact" href="#contact" (click)="closeMenu()"
        >Votre projet <span aria-hidden="true">↗</span></a
      >
    </div>
  </nav>
</header>
